name: Pilot
description: 'Pilot provides bookkeeping, tax, and CFO services for startups and small
  businesses, pairing purpose-built financial software with a team of finance experts
  and former operators. Its offerings include monthly bookkeeping, corporate tax preparation
  and filing, R&D tax credit studies, fractional CFO and COO support, and stock administration.
  Pilot serves venture-backed startups and growing SMBs, integrating with accounting
  and payroll tools to deliver accurate books and financial reporting. Pilot is backed
  by CRV, Foundry Group, Index Ventures, SV Angel, Techstars, and Union Square Ventures.
  As of this profile Pilot does not publish a public developer API or developer portal;
  its product is delivered as a managed service through its web application.'
